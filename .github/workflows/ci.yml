name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore, format-check, release-build, test, and audit
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Publish and smoke-test headless package
        shell: pwsh
        run: |
          ./scripts/test-headless-packaging.ps1
          ./scripts/publish-headless-test-build.ps1 -NoRestore -OutputDirectory artifacts/builds/ci-smoke
          dotnet ./artifacts/builds/ci-smoke/game/DisciplesRemaster.Godot.dll render-project ./artifacts/builds/ci-smoke/samples/minimal.project.json --width 8 --height 6
          if ($LASTEXITCODE -ne 0) { throw 'Packaged game smoke test failed.' }
          dotnet ./artifacts/builds/ci-smoke/editor/DisciplesRemaster.Editor.dll validate-content ./artifacts/builds/ci-smoke/samples/content/synthetic.package.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged editor smoke test failed.' }
